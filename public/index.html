<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gift List</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <header class="site">
      <h1 id="title">Gift List</h1>
      <p id="intro"></p>
    </header>
    <main id="sections" aria-live="polite"></main>
    <p id="empty" class="empty hidden">Nothing here yet — check back soon!</p>
  </div>

  <script src="/card.js"></script>
  <script src="/categories.js"></script>
  <script>
    (async function () {
      const main = document.getElementById('sections');
      try {
        const res = await fetch('/api/items');
        const { settings, items } = await res.json();
        document.getElementById('title').textContent = settings.title;
        document.getElementById('intro').textContent = settings.intro;
        document.title = settings.title;
        // One section per category, in a fixed order; empty ones are skipped.
        for (const { id, label } of giftCategories.CATEGORIES) {
          const inSection = items.filter((item) => giftCategories.categoryOf(item) === id);
          if (!inSection.length) continue;
          const section = document.createElement('section');
          section.className = 'gift-section';
          const heading = document.createElement('h2');
          heading.textContent = label;
          const grid = document.createElement('div');
          grid.className = 'grid';
          inSection.forEach((item) => grid.append(renderCard(item)));
          section.append(heading, grid);
          main.append(section);
        }
        document.getElementById('empty').classList.toggle('hidden', items.length > 0);
      } catch {
        main.textContent = 'Sorry, the list could not be loaded. Please try again later.';
      }
    })();
  </script>
</body>
</html>
