<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gift List</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <header class="site">
      <h1 id="title">Gift List</h1>
      <p id="intro"></p>
    </header>
    <main id="grid" class="grid" aria-live="polite"></main>
    <p id="empty" class="empty hidden">Nothing here yet — check back soon!</p>
  </div>

  <script src="/card.js"></script>
  <script>
    (async function () {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/items');
        const { settings, items } = await res.json();
        document.getElementById('title').textContent = settings.title;
        document.getElementById('intro').textContent = settings.intro;
        document.title = settings.title;
        items.forEach((item) => grid.append(renderCard(item)));
        document.getElementById('empty').classList.toggle('hidden', items.length > 0);
      } catch {
        grid.textContent = 'Sorry, the list could not be loaded. Please try again later.';
      }
    })();
  </script>
</body>
</html>
